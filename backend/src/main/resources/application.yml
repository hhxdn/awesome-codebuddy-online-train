server:
  port: 8088

spring:
  application:
    name: online-train
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/online_train?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

knife4j:
  enable: true
  setting:
    language: zh-CN

jwt:
  secret: online-train-jwt-secret-key-2024
  expiration: 86400000

upload:
  path: ./uploads/

# 腾讯云配置
tencent:
  cloud:
    secret-id: AKIDzIagaHXcUBh7PUP8e096ayD1e50kJky3
    secret-key: ymOnz0pSlzCMRSGrHVzKDya2JPK4edR2
  cos:
    region: ap-guangzhou
    bucket: wodiwodix-online-train-1259412410
    cdn-domain:  # 可选，CDN加速域名，如 https://cdn.example.com
  vod:
    sub-app-id: 1500065209
    region: ap-beijing

# 微信支付配置
wx:
  pay:
    app-id: your_wx_appid
    app-secret: your_wx_app_secret
    mch-id: your_mchid
    api-v3-key: your_api_v3_key
    private-key-path: classpath:apiclient_key.pem
    serial-no: your_cert_serial_no
    notify-url: http://127.0.0.1:8088/api/payment/callback/wechat

logging:
  level:
    com.onlinetrain: debug
